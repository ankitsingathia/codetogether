name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Server/package-lock.json
      - run: npm ci
      # Starts the real server with no Gemini key and drives it over Socket.IO.
      - run: npm test

  # Real containers: checks that a run that times out really stops its
  # container, and that the sandbox has no network.
  docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Server/package-lock.json
      - run: npm ci
      - run: docker pull python:3
      - run: node --test test/docker.test.js
        env:
          RUN_DOCKER_TESTS: "1"

  # Two server instances sharing one Redis: rooms, edits, cursors and
  # cleanup across servers, plus the Redis store itself.
  redis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: Server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Server/package-lock.json
      - run: npm ci
      - run: node --test --test-timeout=60000 --test-reporter=spec test/store.test.js test/cluster.test.js 2>&1 | tee redis-tests.log; exit ${PIPESTATUS[0]}
        shell: bash
        env:
          REDIS_URL: redis://localhost:6379
      # Job logs need a GitHub login; annotations don't. Put the failures
      # where anyone looking at the run can read them.
      - if: failure()
        shell: bash
        run: |
          details=$( (grep -E -A12 "(not ok|✖|Error|timed out|still running)" redis-tests.log || tail -60 redis-tests.log) | head -120 | sed -e 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }')
          echo "::error title=Redis tests failed::${details}"

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
